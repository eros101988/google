<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC 5星評論極速生成器</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { max-width: 480px; margin: 20px auto; padding: 16px; background-color: #f2f2f7; color: #1c1c1e; }
        .card { background: #ffffff; padding: 24px; border-radius: 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; font-size: 20px; text-align: center; color: #000; }
        label { font-size: 14px; font-weight: 600; display: block; margin-bottom: 8px; color: #3c3c43; }
        input { width: 100%; padding: 14px; border: 1px solid #c6c6c8; border-radius: 10px; font-size: 15px; margin-bottom: 16px; outline: none; }
        .btn { width: 100%; background-color: #007aff; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
        .btn-success { background-color: #34c759; }
        .btn-test { background-color: #ff9500; }
        .result-box { margin: 12px 0 16px 0; padding: 12px; background: #f2f2f7; border-radius: 8px; word-break: break-all; font-family: monospace; font-size: 13px; color: #000; border: 1px solid #e5e5ea; }
    </style>
</head>
<body>

<div class="card">
    <h2>NFC 5星評論極速生成器</h2>

    <label for="placeInput">輸入 Place ID 或店名：</label>
    <input type="text" id="placeInput" placeholder="貼上 Place ID (ChIJ...) 或輸入店名">

    <button class="btn" onclick="handleGenerate()">⚡ 生成 5 星網址</button>

    <div id="outputArea" style="display:none;">
        <label>生成結果：</label>
        <div class="result-box" id="resultUrl"></div>
        <button class="btn btn-test" onclick="testUrl()">🧪 測試連結（確認跳出 5 星彈窗）</button>
        <button class="btn btn-success" onclick="copyToClipboard()">📋 複製網址 (準備燒錄 NFC)</button>
    </div>
</div>

<script>
    document.getElementById('placeInput').addEventListener('input', function(e) {
        let val = e.target.value.trim();
        let match = val.match(/ChIJ[a-zA-Z0-9_-]{23,}/);
        if (match) {
            processPlaceId(match[0]);
        }
    });

    function handleGenerate() {
        const input = document.getElementById('placeInput').value.trim();
        if (!input) {
            alert('請輸入店名或貼上 Place ID！');
            return;
        }

        let match = input.match(/ChIJ[a-zA-Z0-9_-]{23,}/);
        if (match) {
            processPlaceId(match[0]);
            return;
        }

        const searchUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(input)}`;
        window.open(searchUrl, '_blank');
    }

    function processPlaceId(placeId) {
        const finalUrl = `https://search.google.com/local/writereview?placeid=${placeId}&hl=zh-TW`;
        document.getElementById('resultUrl').innerText = finalUrl;
        document.getElementById('outputArea').style.display = 'block';
    }

    function testUrl() {
        const urlText = document.getElementById('resultUrl').innerText;
        window.open(urlText, '_blank');
    }

    function copyToClipboard() {
        const urlText = document.getElementById('resultUrl').innerText;
        navigator.clipboard.writeText(urlText).then(() => {
            alert('網址已複製！可以直接貼進 NFC Tools 燒錄！');
        });
    }
</script>

</body>
</html>
